# Secret scanning rules for claude-standards itself.
#
# This repo mandates path-keyed credential rules for every project that adopts
# it, so it runs the same rules it requires. Adopting projects get their own
# generated equivalent via /adopt-standards — this file is not copied to them.
#
# Why path-keyed rules exist at all: gitleaks' default rules match credentials
# that have a recognisable shape (`ghp_...`, AWS key IDs). They do not match
# opaque high-entropy values — a storage-account key, a secret_key_base, a
# database passphrase — in any file, including a plain .env. Those are most of
# what our projects actually hold. Detecting the *secret* is not solvable;
# detecting that a file we have declared credential-bearing is being committed
# with values in it is trivial, and it fails the commit.
#
# See docs/secrets.md for where this sits in the layered controls.

# Matches the hook revision pinned in .pre-commit-config.yaml. Without it,
# an older gitleaks silently ignores syntax it doesn't understand.
minVersion = "8.30.0"

[extend]
useDefault = true

# A declared credential-bearing file, committed with an assigned value.
#
# Keys with empty values do not fire, so a committed .env.example stays clean.
# `.env.example` does not match `\.env$`, so it is not covered by this rule at
# all. The optional `export ` prefix covers direnv's .envrc.
[[rules]]
id = "credential-file-with-value"
description = "A credential-bearing file is being committed with values in it"
path = '''(^|/)(\.env|\.env\.local|\.envrc|\.netrc|\.npmrc|\.pypirc|\.Renviron|local_settings\.py|secrets\.toml)$'''
regex = '''(?m)^\s*(export\s+)?[^#\s][^\r\n]*=\s*\S+'''

# The 1Password reference file: op:// references, comments and blanks only.
#
# .env.1password stays gitignored. These rules are the backstop for when it
# gets committed anyway (git add -f, a project that un-ignores it), and they
# can't reuse credential-file-with-value: a reference *is* a value, so "has a
# value" would fire on every line. Instead they allow the shapes the file
# should hold and flag everything else.
#
#   with-value  - any assignment, commented-out ones included, whose value
#                 doesn't start with op://. RE2 has no lookahead, so the regex
#                 spells out every way a value can fail to begin that way.
#   stray-line  - any line that's neither a comment nor an assignment: a pasted
#                 bare token, `KEY: value`, the body of a multi-line value.
#
# Only the op:// prefix is checked; text after it isn't inspected. Only the
# exact filename is covered. An uppercase OP:// is flagged, failing closed.
# secretGroup captures the whole value: on gitleaks 8.30.1 a finding whose
# captured secret is one character long was not reported.
[[rules]]
id = "op-reference-file-with-value"
description = "A 1Password reference file assigns a value that is not an op:// reference"
path = '''(^|/)\.env\.1password$'''
regex = '''(?m)^[ \t]*(?:#[ \t]*(?:export[ \t]+)?[A-Za-z_][A-Za-z0-9_.-]*[ \t]*|[^#\s=][^=\r\n]*)=[ \t]*((?:["'][ \t]*)?(?:[^o"'\s]|o[^p]|op[^:]|op:[^/]|op:/[^/])[^\r\n]*)'''
secretGroup = 1

[[rules]]
id = "op-reference-file-stray-line"
description = "A 1Password reference file has a line that is neither a comment nor an assignment"
path = '''(^|/)\.env\.1password$'''
regex = '''(?m)^[ \t]*([^#\s=][^=\n]*)$'''
secretGroup = 1

# Paths that must never be committed, whatever they contain.
#
# No `regex` key: the path match alone is the finding. These are files whose
# mere presence in a commit is the problem — a Rails master key, a Claude Code
# permission allowlist, a console transcript, a private key.
[[rules]]
id = "never-commit-path"
description = "This path must never be committed"
path = '''(^|/)(\.claude/settings\.local\.json|\.httr-oauth|\.RData|\.Rhistory|\.Rapp\.history|\.byebug_history|\.irb_history)$|\.(pem|key|p12|pfx)$'''
